[workspace]
resolver = "3"
members = ["crates/orbit", "crates/orbit-cli"]
# M2's planner reads the deleted Δv network; it rejoins at M1a step 11.
exclude = ["crates/plan"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# The tests integrate orbits for months; unoptimized they take minutes.
# Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 2
