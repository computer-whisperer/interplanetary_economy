# The economy for the M2 kill-test (crates/plan): prices, ships, plants,
# resources and demand. Uncertain values are distributions, sampled once per
# game: { median, sigma } is lognormal (sigma of the natural log), { low,
# high } is uniform, a bare number is fixed.
#
# Units: tonnes (t), $M for money unless a key says otherwise, t/yr for
# rates. Sources are cited inline; [ext] marks our own extrapolation from
# them, and [guess] a value with no published anchor.

start = "2040-01-01"
end = "2076-01-01"
discount_rate = 0.04

surfaces = ["moon-south-pole", "moon-mare", "mars-surface"]

# Two propellants share LOX; each ship burns one. Fuel boil-off applies to
# stocks at every node and to cargo in transit.

[propellant.methalox]
isp_s = 375.0
mixture = 3.6

[propellant.hydrolox]
# RL10C-1-1 453.8 s at O/F 5.5, RL10C-X 460.9 s (L3Harris); RL10A-3-3B
# qualified at O/F 6.0; Metzger 2023 and Kleinhenz & Paz use 450 s and O/F 6
# (NTRS 20205008303). At O/F 6, lunar water leaves 29% of its mass as spare
# oxygen.
isp_s = 450.0
mixture = 6.0
# LH2 boil-off: passive LEO depot with sunshield 0.04–0.16%/day for LH2+LOX
# (NASA/ULA model, NTRS 20120010675); Centaur as flown ~2%/day. A 2040s
# depot or tanker: 0.05%/day (0.01–0.2) [ext]. LOX and methane boil off
# ~5× less and are taken as storable.
fuel_boiloff_per_day = { median = 0.0005, sigma = 0.9 }

[earth]
# Reusable heavy launch, $/kg to LEO. 2040: Citi GPS 2022 ($100), Terzi &
# Nicoli 2026 ($273), ~$600 if reuse disappoints [ext]. 2075: Metzger 2023
# (arXiv:2303.09011) gives $119/kg at 44 kt/yr up-mass, $30 at 436 kt/yr,
# $436 at 4.4 kt/yr. Interpolated geometrically between the two.
launch_usd_per_kg_start = { median = 250.0, sigma = 0.6 }
launch_usd_per_kg_end = { median = 100.0, sigma = 0.6 }
# Recurring fabrication of space industrial hardware, $/kg: Hein et al. 2020
# optimistic mass production $10k; Metzger 2023 range across studies
# $23–61k; Starlink-class ~$1k [ext].
equipment_usd_per_kg = { median = 10000.0, sigma = 0.8 }
propellant_usd_per_kg = 0.5

[budget]
# Capital spending only (equipment and ships). NASA FY2026 is $27.5B, of
# which human exploration ~$12–15B; an Apollo-peak share is ~$58B (2025$).
# A "coherent, well-funded" Authority at $20–60B/yr, about half capital
# [guess].
musd_per_year = { low = 10000.0, high = 30000.0 }

[metals]
# Platinum-group metals sold on Earth. World PGM market ~550 t/yr, ~$55/g
# basket (WPIC 2025, 2026 prices). Price elasticity of demand about −0.5
# [ext from WPIC, USGS 2025]: steps follow P = P0 (1 + C/5500 t)^−2 for
# cumulative sales C, assuming asteroid supply spread over ~10 years [ext].
steps = [[500.0, 50000.0], [1500.0, 36000.0], [3000.0, 21000.0], [10000.0, 7000.0], [1e6, 2000.0]]
price_factor = { median = 1.0, sigma = 0.5 }

[[ship]]
# Starship-class. Cost: no audited figure; $30M / $80M / $250M low /
# central / high [ext from Musk 2019 and second-hand ~$100M reports].
id = "hauler"
dry_t = 120.0
propellant_t = 1200.0
cargo_t = 100.0
price_musd = { median = 80.0, sigma = 0.6 }
propellant = "methalox"
aero = true
interplanetary = true
lands = ["mars-surface"]
turnaround_days = 5.0

[[ship]]
# Cislunar lander/tanker: no heat shield, no interplanetary capability
# [guess, scaled from the hauler].
id = "lander"
dry_t = 40.0
propellant_t = 400.0
cargo_t = 100.0
price_musd = { median = 40.0, sigma = 0.6 }
propellant = "methalox"
lands = ["moon-south-pole", "moon-mare"]
turnaround_days = 3.0

[[ship]]
# Reusable hydrolox lander/tanker. Blue Moon Mk2: 16 t dry, ~29–40 t
# propellant, 20 t reusable payload (crewed, heavy); Lockheed Martin 2018
# lander 22 t dry, 40 t propellant; Metzger 2023 uses an inert mass
# fraction of 0.10. Cargo version at dry/propellant 0.2, scaled up; price
# at ~$1.5M per dry tonne against the methalox lander's $1M [ext].
id = "lander-h"
dry_t = 30.0
propellant_t = 150.0
cargo_t = 50.0
price_musd = { median = 45.0, sigma = 0.6 }
propellant = "hydrolox"
lands = ["moon-south-pole", "moon-mare"]
turnaround_days = 3.0

[[ship]]
# Reusable cislunar tug with an aerobrake for LEO returns. NASA JSC 1985
# aerobraked OTV: 4.43 t dry (17% aerobrake), 38 t propellant, 13.5 t to
# GEO (NTRS 19850012952); ULA ACES ~5.9 t dry, 68 t propellant. Scaled ×4
# at dry/propellant 0.12 [ext].
id = "tug-h"
dry_t = 18.0
propellant_t = 150.0
cargo_t = 50.0
price_musd = { median = 27.0, sigma = 0.6 }
propellant = "hydrolox"
aero = true
turnaround_days = 3.0

# Plants: equipment t per t/yr of output = plant + ore / grade, where ore is
# equipment per t/yr of ore handled and grade is product per ore mass.

[[facility]]
# Polar ice to LOX and LH2 (water is 8:1 by mass; no carbon on the Moon).
# Output counts all of the water. Studies quote LOX+LH2 propellant, ~1.3–1.5
# t of water per t: Metzger 2023 baseline 0.05 t per t/yr of propellant (25 t
# for 500 t/yr), ≈ 0.035 per t/yr of water; Kornuta et al. 2019 30 t for
# 2,450 t/yr of water, ≈ 0.012; Kleinhenz & Paz 2021 pilot plant ~1.2 with
# power. Excavation scales with 1/grade (Kleinhenz & Paz 2021; Sowers &
# Dreyer 2019); split here 0.017 + 0.018 at 5.6 wt% [ext]. Grade: water,
# LCROSS 5.6 ± 2.9 wt% (Colaprete et al. 2010).
id = "lunar-ice"
node = "moon-south-pole"
output = { lox = 0.889, lh2 = 0.111 }
equipment_t_per_tpy = { plant = { median = 0.017, sigma = 0.8 }, ore = { median = 0.001, sigma = 0.8 } }
grade = { median = 0.056, sigma = 0.5 }
build_months = 12.0
technology = "lunar-ice"
# Prospecting: VIPER ~$0.93B with its lander (cancelled 2024; Planetary
# Society); CLPS-class payloads ~$0.06–0.35B (PRIME-1 delivery $47M), 3–5
# years. By 2040, CLPS-class [ext].
survey = { cost_musd = { median = 300.0, sigma = 0.7 }, years = { median = 3.0, sigma = 0.25 } }

[[facility]]
# Oxygen from regolith at a sunlit polar site: carbothermal 0.39 t/(t/yr)
# with power and margin (Linne et al. 2021); molten regolith electrolysis
# 0.28 (Guerrero-Gonzalez & Zabel 2023).
id = "regolith-oxygen-polar"
node = "moon-south-pole"
output = { lox = 1.0 }
equipment_t_per_tpy = { plant = { median = 0.35, sigma = 0.4 }, ore = 0.0 }
grade = 1.0
build_months = 12.0
technology = "regolith-oxygen"

[[facility]]
# Same at a mare site, which adds the 14-day night: fission or storage
# brings it to ~0.8–1.0 [ext from Linne et al. 2021 power figures].
id = "regolith-oxygen-mare"
node = "moon-mare"
output = { lox = 1.0 }
equipment_t_per_tpy = { plant = { median = 0.9, sigma = 0.4 }, ore = 0.0 }
grade = 1.0
build_months = 12.0
technology = "regolith-oxygen"

[[facility]]
# Methalox from ground ice and atmospheric CO2 (CO2 + 2H2O → CH4 + 2O2, so
# O2:CH4 = 4:1). Kleinhenz & Paz 2017: 1.7 t, 52 kW for 22.6 t/yr; with
# fission at 0.15 t/kWe 0.42 t/(t/yr), without power 0.075, solar with
# storage ~0.8 [ext]. Mid-latitude ground ice is rich, so ore handling is
# minor [guess].
id = "mars-ice"
node = "mars-surface"
output = { lox = 0.8, ch4 = 0.2 }
equipment_t_per_tpy = { plant = { median = 0.35, sigma = 0.6 }, ore = 0.0005 }
grade = { median = 0.3, sigma = 0.5 }
build_months = 12.0
technology = "mars-ice"
# Ice mapping: Mars Ice Mapper, NASA share $185M of an international
# mission, ~$0.25–0.8B in all, 6–7 years (SpaceNews 2020) [ext].
survey = { cost_musd = { median = 500.0, sigma = 0.5 }, years = { median = 6.0, sigma = 0.25 } }

[[facility]]
# Phobos may be carbonaceous (D-type spectrum) or not; if volatile-rich,
# like a C-type asteroid plant with Mars-distance sunlight (×2.3 power
# mass) [guess].
id = "phobos-volatiles"
node = "phobos"
output = { lox = 0.7826, ch4 = 0.2174 }
equipment_t_per_tpy = { plant = { median = 0.2, sigma = 0.8 }, ore = { median = 0.001, sigma = 0.8 } }
grade = { median = 0.06, sigma = 0.5 }
present = 0.4
build_months = 12.0
technology = "volatiles"
# JAXA MMX: development ~$0.35B, ~8 years from approval to Phobos remote
# sensing; a follow-on with heritage ~6 [ext].
survey = { cost_musd = { median = 400.0, sigma = 0.4 }, years = { median = 6.0, sigma = 0.25 } }

# Asteroid composition priors by spectral class; the weights are the
# probability of each asteroid_plant's resource, the rest is barren.

[[asteroid_class]]
spectral = ["C", "B", "Cb", "Ch", "Cg", "Cgh", "D"]
albedo = 0.06
density_t_per_m3 = 1.3
composition = { volatiles = 0.85 }

[[asteroid_class]]
spectral = ["S", "Sq", "S(IV)", "Sr", "Sk", "Q", "V"]
albedo = 0.25
density_t_per_m3 = 2.7
composition = { pgm = 0.03 }

[[asteroid_class]]
spectral = ["X", "Xe", "Xc", "Xk", "M"]
albedo = 0.2
density_t_per_m3 = 3.5
composition = { pgm = 0.4, volatiles = 0.1 }

[[asteroid_class]]
# NHATS small bodies with no spectrum [guess, roughly the NEA population].
spectral = ["unknown"]
albedo = 0.14
density_t_per_m3 = 2.0
composition = { volatiles = 0.3, pgm = 0.08 }

[[asteroid_plant]]
# Methalox from hydrated minerals and organics. Plant alone is light:
# Sercel 2016 (APIS) claims <2 t for tens of t/week; whole systems
# including transport run 0.14 (APIS) to 3.7 (Calla et al. 2018) t/(t/yr),
# so plant-only 0.1 [ext]. Grade: CI ~12 wt% water, CM 6–13 (Garenne et al.
# 2014); carbon 2–4.7 wt% limits methane, ~0.136 methalox per CI mass at
# 63% carbon recovery [ext].
id = "volatiles"
output = { lox = 0.7826, ch4 = 0.2174 }
equipment_t_per_tpy = { plant = { median = 0.1, sigma = 0.8 }, ore = { median = 0.001, sigma = 0.8 } }
grade = { median = 0.10, sigma = 0.35 }
minable_fraction = 0.5
build_months = 12.0
technology = "volatiles"
# Small-sat prospector: Janus <$49M for two craft, AstroForge Odin <$7M, DSI
# Prospector-1 "tens of millions"; ~3 years to build, cruise and
# characterize (2–5). Flagships cost ~$0.4–1.4B (Hayabusa2, OSIRIS-REx).
survey = { cost_musd = { median = 50.0, sigma = 0.7 }, years = { median = 3.0, sigma = 0.3 } }

[[asteroid_plant]]
# Platinum-group metals from metal-rich material: total PGM 7 / 27 / 75 ppm
# (median / 70th / 90th percentile, Elvis 2014 after Kargel 1994), 50%
# recovery. Metal ore is hard to process [guess: 0.003 t per t/yr ore].
# Hein et al. 2020: returning platinum is viable only under unlikely
# conditions.
id = "pgm"
output = { metal = 1.0 }
equipment_t_per_tpy = { plant = 5.0, ore = { median = 0.003, sigma = 1.0 } }
grade = { median = 10e-6, sigma = 0.8 }
minable_fraction = 0.5
build_months = 12.0
technology = "pgm"
survey = { cost_musd = { median = 50.0, sigma = 0.7 }, years = { median = 3.0, sigma = 0.3 } }

# Technology programs: development (non-recurring cost, not plant hardware)
# from program start to the first installable plant, paid at no more than
# cost / years per year. Every plant names its technology; a plant on a
# deposit of uncertain content also names the survey that characterizes it,
# and a survey's cost is divided by the prior probability that the deposit
# has the resource. Durations count from 2040 and assume each technology is
# at TRL 5–6 by then [ext]; from today's TRL, NASA data average 7.25 years
# for TRL 4→9 (Acquisition Research Symposium paper SYM-AM-12-154). Study
# development costs assume NASA-style hardware at $23–61k/kg, above this
# file's $10k/kg.

[[technology]]
# Metzger 2023 (arXiv:2303.09011) Table A-1, development $/kg × surface
# plant mass: $0.9B (Sowers) to $5.2B (Bennett), baseline $3.0B (2022$);
# Kornuta et al. 2019 all-in initial capability ~$4B (2019$). Build-up ~5
# years after TRL 6 (3–8).
id = "lunar-ice"
cost_musd = { median = 3300.0, sigma = 0.6 }
years = { median = 5.0, sigma = 0.3 }

[[technology]]
# No published DDT&E. Sierra Space carbothermal reached TRL 6 in 2024
# (NTRS 20250004151); Blue Origin MRE Tipping Point $34.7M. Metzger's
# ~$120k/kg × a 10–25 t first plant: $0.5–3.5B [ext]. 4–10 years.
id = "regolith-oxygen"
cost_musd = { median = 2000.0, sigma = 0.6 }
years = { median = 5.0, sigma = 0.3 }

[[technology]]
# Rapp 2024 (MOXIE deputy PI): ice-based ISRU "$10 billion… perhaps
# considerably more", atmosphere-only ~$5B, both guesses; NASA's 5.2 t plant
# plus 12.1 t reactor at $120k/kg ≈ $2.3B (NTRS 20160006324). MOXIE took 7
# years to operate; full ISRU ~12 from start (8–18), ~8 from TRL 6 [ext].
id = "mars-ice"
cost_musd = { median = 5000.0, sigma = 0.6 }
years = { median = 8.0, sigma = 0.3 }

[[technology]]
# Small-unit studies: Calla et al. 2018 first unit with R&D ~$215M; Hein et
# al. 2020 $0.11–1.2B. No extraction has been demonstrated in space. The
# NASA-style $120k/kg on a 10–25 t first plant gives $1.2–3B. Median between
# the two [ext]. 5–12 years.
id = "volatiles"
cost_musd = { median = 1500.0, sigma = 0.9 }
years = { median = 7.0, sigma = 0.3 }

[[technology]]
# No published DDT&E; AstroForge has raised $55M and lost its refinery demo
# (2023) and Odin (2025). 8–20 years [guess].
id = "pgm"
cost_musd = { median = 2000.0, sigma = 1.0 }
years = { median = 10.0, sigma = 0.3 }

# Third-party demand: Q = ref_tpy × (price / ref_usd_per_kg)^−elasticity,
# growing each year. Launch-market elasticity is ~1.5–2.5 below a few
# $k/kg (Metzger 2023 citing Ross et al.). Payload demand to Mars, the Moon
# and asteroids has no published curve [guess].

[[demand]]
# Earth-departing traffic refuelling at the hub. ULA's 2016 offer: $1,000/kg
# at EML1; Sercel 2016: ~400 t/yr at the top of the well. ULA's offers were
# for LOX/LH2 (Kutter 2016: $3,000/kg in LEO, $500/kg on the lunar surface);
# Starship refuels with methalox. Split at L1 50/50 (hydrolox 30–80%)
# [guess].
id = "hub-propellant"
what = "propellant"
split = { methalox = 0.5, hydrolox = 0.5 }
nodes = ["eml1"]
ref_tpy = { median = 400.0, sigma = 0.7 }
ref_usd_per_kg = 1000.0
elasticity = 1.5
growth = 0.03
max_usd_per_kg = 64000.0
min_usd_per_kg = 125.0

