# A ship on every Earth–Mars window from 2040 to 2075 (M1c.md, gate item
# 3): the windows `orbit windows earth mars` finds, each ship leaving LEO
# within one for a 400 km Mars orbit, at the date and duration patched
# conics price cheapest.

name = "Mars windows 2040-2075"

[[ship]]
name = "Mars 2041"
start = { at = "leo", epoch = "2041-09-30" }
[[ship.leg]]
to = { low = "mars", altitude = 400 }
window = ["2041-09-30", "2041-11-07"]

